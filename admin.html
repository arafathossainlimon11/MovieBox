<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieBox Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">MOVIEBOX ADMIN PANEL</div>
  </header>

  <main class="container admin-container">
    <h2>নতুন মুভি / এনিম যুক্ত করুন</h2>
    <form id="addMovieForm">
      
      <div class="form-group">
        <label>টাইটেল (Title):</label>
        <input type="text" id="movieTitle" placeholder="Overgeared Season 01 Hindi, Tamil..." required>
      </div>

      <div class="form-group">
        <label>ক্যাটাগরি (Category):</label>
        <select id="movieCategory" style="width: 100%; padding: 10px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 4px;">
          <option value="Animation">Animation</option>
          <option value="Action">Action</option>
          <option value="Hindi">Hindi</option>
          <option value="English">English</option>
          <option value="Bangla">Bangla</option>
          <option value="Series">Series</option>
          <option value="Romance">Romance</option>
          <option value="Horror">Horror</option>
        </select>
      </div>

      <!-- 🔒 গোপন SEO কিওয়ার্ড ফিল্ড -->
      <div class="form-group seo-box">
        <label style="color: #38bdf8;">🔒 SEO Keywords (গোপন কিওয়ার্ড - গুগল সার্চ কনসোলের জন্য):</label>
        <p class="seo-help">* এই কিওয়ার্ডগুলো ইউজারদের ওয়েবসাইটে দেখাবে না। কিন্তু গুগল সার্চ কনসোল ও ইনডেক্সিংয়ে মুভিটি সহজে খুঁজে পাওয়ার জন্য কাজ করবে। (কমা দিয়ে লিখুন)</p>
        <textarea id="seoKeywords" rows="3" placeholder="overgeared season 1 bangla, overgeared episode 1 1080p download, anime bangla dub, crunchyroll anime..."></textarea>
      </div>

      <h3>এপিসোড ও ডাউনলোডের লিংকসমূহ:</h3>
      <div id="episodesContainer">
        <!-- জাভাস্ক্রিপ্ট দিয়ে এপিসোড ফিল্ড তৈরি হবে -->
      </div>

      <button type="button" class="btn-add" id="addEpBtn">+ নতুন এপিসোড যুক্ত করুন</button>

      <br><br>
      <button type="submit" class="btn-submit">ওয়েবসাইটে সেভ ও পাবলিশ করুন (Publish Movie)</button>
    </form>

    <hr class="divider">
    <h3>বর্তমান যুক্ত থাকা মুভিসমূহ:</h3>
    <div id="adminMovieList"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
