<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieBox BD - Watch and Download Anime & Movies</title>
  
  <!-- গুগল সার্চ কনসোলের জন্য ডায়নামিক গোপন মেটা কিওয়ার্ড (ইউজার প্যানেলে ব্যাকগ্রাউন্ডে থাকবে) -->
  <meta name="keywords" id="dynamic-keywords" content="moviebox, anime bangla dubbed, movie download bd">
  <meta name="description" id="dynamic-description" content="Watch and download anime, series and movies in high quality for free.">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- হেডার প্যানেল -->
  <header class="navbar">
    <div class="logo">MOVIEBOX</div>
  </header>

  <main class="container">
    <!-- ক্যাটাগরি বাটনসমূহ -->
    <div class="category-buttons">
      <button class="cat-btn" onclick="filterCategory('all')">Home</button>
      <button class="cat-btn" onclick="filterCategory('Hindi')">Hindi</button>
      <button class="cat-btn" onclick="filterCategory('English')">English</button>
      <button class="cat-btn" onclick="filterCategory('Bangla')">Bangla</button>
      <button class="cat-btn" onclick="filterCategory('Action')">Action</button>
      <button class="cat-btn" onclick="filterCategory('Romance')">Romance</button>
      <button class="cat-btn" onclick="filterCategory('Horror')">Horror</button>
      <button class="cat-btn" onclick="filterCategory('Animation')">Animation</button>
      <button class="cat-btn" onclick="filterCategory('Series')">Series</button>
    </div>

    <!-- সার্চ বার (১-ক্লিক এডের সাথে যুক্ত) -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Movie বা Series-এর English নাম লিখুন..." autocomplete="off">
    </div>

    <!-- মেইন কন্টেন্ট এরিয়া (মুভি এবং স্ক্রিনশটের মতো সুন্দর ডাউনলোডের লেআউট) -->
    <div id="contentArea">
      <!-- জাভাস্ক্রিপ্ট দিয়ে সব ডাটা রেন্ডার হবে -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
                            </html>
